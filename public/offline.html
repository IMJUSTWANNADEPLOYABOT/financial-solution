<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Нет соединения · Finance Auditor</title>
    <style>
      :root { color-scheme: light dark; --accent: #7c3aed; }
      @media (prefers-color-scheme: dark) { :root { --accent: #a78bfa; } }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: Canvas; color: CanvasText; text-align: center;
      }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 20px; margin: 16px 0 6px; }
      p { margin: 0 0 20px; opacity: 0.7; }
      button {
        font: inherit; border: 0; border-radius: 10px; padding: 10px 18px;
        background: var(--accent); color: #fff; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon-192.png" alt="" />
      <h1>Нет соединения</h1>
      <p>Данные хранятся на сервере — подключись к интернету, чтобы продолжить.</p>
      <button onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
