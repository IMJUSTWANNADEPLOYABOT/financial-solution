# Вставьте эти блоки внутрь существующего server { ... } для andrewha.tech (HTTPS, порт 443).
# Приложение в контейнере слушает 127.0.0.1:3010 и само обслуживает префикс /finance-auditor
# (basePath в next.config.ts), поэтому путь проксируется как есть — без обрезки префикса.

location /finance-auditor {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # WebSocket/стриминг ответов Next.js
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;

    proxy_read_timeout 60s;
    client_max_body_size 2m;
}

# Неизменяемая статика сборки — кэшируем надолго.
location /finance-auditor/_next/static/ {
    proxy_pass http://127.0.0.1:3010;
    proxy_set_header Host $host;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Service worker не должен кэшироваться, иначе обновления приложения не дойдут.
location = /finance-auditor/sw.js {
    proxy_pass http://127.0.0.1:3010;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
}

# ---------------------------------------------------------------------------
# Если в конфиге ещё нет переменной $connection_upgrade, добавьте в блок http { }
# (например, в /etc/nginx/conf.d/websocket-map.conf):
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
